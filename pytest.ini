[pytest]
# Pytest configuration for model_transferability

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Show warnings
    -W default
    # Coverage options (if pytest-cov is installed)
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Stop on first failure (comment out for full test run)
    # -x
    # Show slowest N tests
    --durations=10

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    gpu: marks tests requiring GPU
    optional: marks tests requiring optional dependencies (gam_ssm_lur, fusiongp2)

# Ignore patterns
# Ignore demo experiments and external packages
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    experiments
    results
    data

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */experiments/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Display options
precision = 2
show_missing = True
